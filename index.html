<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Progress</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Job Progress</h1>
      <p class="subtitle">Every application, one place.</p>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-export-json" class="btn btn-ghost">Export JSON</button>
      <button type="button" id="btn-export-csv" class="btn btn-ghost">Export CSV</button>
      <button type="button" id="btn-import" class="btn btn-ghost">Import</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button type="button" id="btn-add" class="btn btn-primary">+ Add job</button>
    </div>
  </header>

  <main>
    <section id="stats" class="stats" aria-label="Summary"></section>

    <section class="toolbar" aria-label="Search and filters">
      <input type="search" id="search" placeholder="Search company, role, location, notes…" aria-label="Search">
      <select id="filter-status" aria-label="Filter by status"></select>
      <select id="sort" aria-label="Sort">
        <option value="updated">Recently updated</option>
        <option value="applied-desc">Date applied (newest)</option>
        <option value="applied-asc">Date applied (oldest)</option>
        <option value="followup">Follow-up (soonest)</option>
        <option value="company">Company (A–Z)</option>
        <option value="status">Status</option>
      </select>
    </section>

    <div class="list-header" aria-hidden="true">
      <span>Company / Role</span>
      <span>Status</span>
      <span>Applied</span>
      <span>Follow up</span>
      <span>Job site</span>
      <span></span>
    </div>
    <section id="list" class="list" role="list"></section>

    <div id="empty" class="empty" hidden>
      <p class="empty-title">No applications yet</p>
      <p class="empty-sub">Add the first job you've applied to and it'll show up here.</p>
      <button type="button" class="btn btn-primary" id="btn-add-empty">+ Add job</button>
    </div>
    <div id="no-results" class="empty" hidden>
      <p class="empty-title">Nothing matches</p>
      <p class="empty-sub">Try a different search or status filter.</p>
    </div>
  </main>

  <dialog id="job-dialog" aria-labelledby="dialog-title">
    <form id="job-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">Add application</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>Company <em>*</em></span>
          <input name="company" required autocomplete="off">
        </label>
        <label class="field">
          <span>Role <em>*</em></span>
          <input name="role" required autocomplete="off">
        </label>
        <label class="field span-2">
          <span>Job link</span>
          <input name="url" type="text" inputmode="url" placeholder="https://company.wd5.myworkdayjobs.com/…" autocomplete="off">
          <small id="portal-hint" class="hint"></small>
        </label>
        <label class="field">
          <span>Status</span>
          <select name="status"></select>
        </label>
        <label class="field">
          <span>Date applied</span>
          <input name="dateApplied" type="date">
        </label>
        <label class="field">
          <span>Location</span>
          <input name="location" placeholder="Remote, NYC, …" autocomplete="off">
        </label>
        <label class="field">
          <span>Salary / range</span>
          <input name="salary" placeholder="$90k–110k" autocomplete="off">
        </label>
        <label class="field">
          <span>Follow up on</span>
          <input name="followUp" type="date">
        </label>
        <label class="field span-2">
          <span>Notes</span>
          <textarea name="notes" rows="3" placeholder="Recruiter name, referral, interview prep…"></textarea>
        </label>
      </div>

      <div id="history" class="history" hidden>
        <h3>Status history</h3>
        <ol id="history-list"></ol>
      </div>

      <div class="dialog-foot">
        <button type="button" id="btn-delete" class="btn btn-danger-ghost">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
